<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="url(#bgGrad2)"/>
  <!-- Decorative Grid / Circles -->
  <circle cx="120" cy="90" r="150" fill="#34D399" fill-opacity="0.15"/>
  <circle cx="500" cy="300" r="130" fill="#6EE7B7" fill-opacity="0.1"/>
  
  <!-- Candidate 2 - Ketua (Left Figure) -->
  <g transform="translate(150, 100)">
    <!-- Body / Suit -->
    <path d="M-60 260 C-60 170 -30 140 0 140 C30 140 60 170 60 260 Z" fill="#1E293B"/>
    <!-- Telkom Blazer Shirt & Tie -->
    <path d="M-25 140 L0 190 L25 140 Z" fill="#FFFFFF"/>
    <path d="M-6 150 L6 150 L4 185 L0 195 L-4 185 Z" fill="#047857"/>
    <!-- Head -->
    <circle cx="0" cy="80" r="45" fill="#FDE68A"/>
    <!-- Hair Modern Pompadour -->
    <path d="M-45 75 C-45 25 45 25 45 75 C30 45 -30 45 -45 75 Z" fill="#18181B"/>
    <!-- Face details -->
    <ellipse cx="-12" cy="78" rx="3.5" ry="4.5" fill="#18181B"/>
    <ellipse cx="12" cy="78" rx="3.5" ry="4.5" fill="#18181B"/>
    <path d="M-15 102 Q0 114 15 102" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Candidate 2 - Wakil (Right Figure) -->
  <g transform="translate(340, 105)">
    <!-- Body / Suit -->
    <path d="M-55 255 C-55 170 -25 145 0 145 C25 145 55 170 55 255 Z" fill="#1E293B"/>
    <!-- Hijab / Scarf -->
    <path d="M-45 65 C-45 15 45 15 45 65 C45 130 30 155 0 155 C-30 155 -45 130 -45 65 Z" fill="#D1FAE5"/>
    <!-- Face -->
    <ellipse cx="0" cy="80" rx="30" ry="36" fill="#FED7AA"/>
    <!-- Inner Hijab frame -->
    <path d="M-28 70 C-28 45 28 45 28 70 C28 95 18 114 0 114 C-18 114 -28 95 -28 70 Z" fill="#FED7AA"/>
    <ellipse cx="-10" cy="76" rx="3" ry="4" fill="#0F172A"/>
    <ellipse cx="10" cy="76" rx="3" ry="4" fill="#0F172A"/>
    <path d="M-12 95 Q0 106 12 95" fill="none" stroke="#9A3412" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Number Badge -->
  <g transform="translate(40, 35)">
    <rect width="90" height="90" rx="18" fill="url(#badgeGrad2)"/>
    <text x="45" y="40" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">PASLON</text>
    <text x="45" y="78" font-family="'Outfit', 'Inter', sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">02</text>
  </g>

  <!-- Bottom Info Overlay -->
  <rect x="0" y="325" width="600" height="75" fill="#064E3B" fill-opacity="0.9"/>
  <text x="300" y="354" font-family="'Outfit', 'Inter', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bagas Satria Wibowo &amp; Nabila Zahra Maharani</text>
  <text x="300" y="380" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#A7F3D0" text-anchor="middle">"Bersinergi, Progresif &amp; Berkarakter Mandiri"</text>
</svg>
